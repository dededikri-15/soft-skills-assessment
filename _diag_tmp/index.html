<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8"><title>diag</title></head>
<body>
<iframe id="f" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">loading...</pre>
<script>
var target = new URLSearchParams(location.search).get('p');
var f = document.getElementById('f');
f.onload = function () {
  try {
    var d = f.contentDocument, w = f.contentWindow;
    var vw = w.innerWidth;
    var docW = d.documentElement.scrollWidth;
    var bad = [];
    var all = d.querySelectorAll('body *');
    for (var i = 0; i < all.length && bad.length < 25; i++) {
      var el = all[i];
      var r = el.getBoundingClientRect();
      if (r.right > vw + 1) {
        var cls = (typeof el.className === 'string' ? el.className : '').slice(0, 55);
        bad.push(el.tagName + '.' + cls + ' | w=' + Math.round(r.width) + ' right=' + Math.round(r.right));
      }
    }
    document.getElementById('out').textContent =
      'vw=' + vw + ' docW=' + docW + ' overflow=' + (docW > vw) + '\n' + bad.join('\n');
  } catch (e) {
    document.getElementById('out').textContent = 'ERR ' + e.message;
  }
};
f.src = target;
</script>
</body>
</html>
